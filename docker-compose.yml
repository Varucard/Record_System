# Ejecución interactiva:  docker compose run --rm record-system
# Pantalla completa:      docker compose run --rm record-system --verde
# Los archivos .dat quedan en ./data del proyecto.
#
# El contenedor corre con el usuario UID:GID indicado (1000:1000 por
# defecto), que debe poder escribir en ./data. Si su usuario tiene
# otro UID:  UID=$(id -u) GID=$(id -g) docker compose run --rm record-system
services:
  record-system:
    build:
      context: .
      target: runtime
    image: record-system:latest
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # clasica (por defecto) o pantalla; tema color o verde.
      RS_INTERFAZ: ${RS_INTERFAZ:-clasica}
      RS_TEMA: ${RS_TEMA:-color}
      # Nombre del negocio en los comprobantes.
      RS_EMPRESA: ${RS_EMPRESA:-Servicio Técnico}
    volumes:
      - ./data:/data
